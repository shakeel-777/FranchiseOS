<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117"/>
      <stop offset="100%" style="stop-color:#1a1d27"/>
    </linearGradient>
    <linearGradient id="fGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d49b3e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square with subtle border -->
  <rect x="8" y="8" width="184" height="184" rx="40" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="184" height="184" rx="40" fill="none" stroke="rgba(129,140,248,0.15)" stroke-width="1.5"/>

  <!-- Subtle grid pattern -->
  <line x1="66" y1="8" x2="66" y2="192" stroke="rgba(255,255,255,0.02)" stroke-width="0.5"/>
  <line x1="133" y1="8" x2="133" y2="192" stroke="rgba(255,255,255,0.02)" stroke-width="0.5"/>
  <line x1="8" y1="66" x2="192" y2="66" stroke="rgba(255,255,255,0.02)" stroke-width="0.5"/>
  <line x1="8" y1="133" x2="192" y2="133" stroke="rgba(255,255,255,0.02)" stroke-width="0.5"/>

  <!-- Main F letter — modern geometric -->
  <g filter="url(#glow)">
    <path d="M68 52 L68 148" stroke="url(#fGrad)" stroke-width="16" stroke-linecap="square"/>
    <path d="M68 52 L128 52" stroke="url(#fGrad)" stroke-width="16" stroke-linecap="square"/>
    <path d="M68 96 L118 96" stroke="url(#fGrad)" stroke-width="12" stroke-linecap="square"/>
  </g>

  <!-- Growth arrow integrated into the F -->
  <g transform="translate(6, -6)" filter="url(#glow)">
    <line x1="128" y1="68" x2="162" y2="34" stroke="url(#arrowGrad)" stroke-width="8" stroke-linecap="round"/>
    <polyline points="146,30 164,34 154,48" fill="none" stroke="url(#arrowGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Small brand dot -->
  <circle cx="100" cy="170" r="3" fill="url(#arrowGrad)" opacity="0.6"/>
</svg>
